<body>
    <img src="../../static/img.login/fundotop.png" width="500" height="190" >
        <h1 id="Titulo">Cadastro de Novos Itens</h1>
      <br><br>

    <form action="/cadastro" method="POST" enctype="multipart/form-data">
    
    <input id="but" type="text" id="nome" name="nome" placeholder="Nome do item" required>
      <br><br><br>
    <input id="but2" type="number" id="qntd" name="qntd" placeholder="Quantidade do item" required>
      <br><br><br>
    <input id="but3" type="text" id="tipo" name="tipo" placeholder="Tipo do item" required>
    <br><br><br>
<div class="upload-container">
    <input id="but7" type="file" name="img" accept="image/*" placeholder="Imagem">
    
    <button type="submit" id="buti">Cadastrar</button>
</form>
