<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/style.login/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../static/style.login/style.js"></script>
    <title>Almoxarifado Senai</title>
</head>
<body>
    <!-- Thiago -->
     
    <br>
        <div id="linha"> 
        <!-- Linha da logo do Senai -->  
            <img src="../../static/img.login/senaib.jpg" width="500px" height="160px">
        </div>
    <br><br><br>
<form action="/pag.login/login.html" method="POST">
        <div id="caixas"> 
            <h2>
                <input type="text" id="usuario" placeholder="Usuário" name="usuario" required>
                    <br><br><br>
                <input type="password" id="senha" placeholder="Senha" name="senha" required>
            </h2>
                <br><br>
        </div> 
        <div id="Entrar">
                <button type="submit" style="height: 60px; width: 220px; font-size: 30px; background-color:#ff9500 ; border-color: rgb(42, 71, 150) ;" class="btn btn-primary">ENTRAR</button> <!-- parte de JS--> 
        </div>

</form>
    {% if erro %}
    <script>
        Swal.fire({
            icon: 'error',
            title: 'Acesso Negado',
            text: 'Usuário ou senha incorretos!',
            confirmButtonColor: '#192a6b'
        });
    </script>
    {% endif %}
<div id="cad1"><a class="link" href="/adm">Login ADM</a></div>

</html>
</body>
</html>
